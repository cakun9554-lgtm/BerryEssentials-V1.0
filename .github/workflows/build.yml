
name: Build BerryEssentials

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Maven Project
        id: locate
        shell: bash
        run: |
          POM=$(find . -type f -name pom.xml \
            -not -path './.git/*' -print -quit)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan!"
            echo "Daftar file repository:"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$POM")

          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Project ditemukan: $POM"

      - name: Build BerryEssentials
        run: |
          mvn --batch-mode -U \
            -f "${{ steps.locate.outputs.pom }}" \
            clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BerryEssentials-JAR
          path: ${{ steps.locate.outputs.project_dir }}/target/*.jar
          if-no-files-found: error




