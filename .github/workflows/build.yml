

name: Build BerryEssentials

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract Source ZIP
        run: |
          mkdir -p extracted
          unzip -o BerryEssentials-source.zip -d extracted

      - name: Find pom.xml
        id: locate
        shell: bash
        run: |
          POM=$(find extracted -type f -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "pom.xml NOT FOUND!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$POM")
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Found Maven project: $POM"

      - name: Build BerryEssentials
        run: |
          mvn --batch-mode -U \
            -f "${{ steps.locate.outputs.pom }}" \
            clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BerryEssentials-JAR
          path: ${{ steps.locate.outputs.dir }}/target/*.jar
          if-no-files-found: error
