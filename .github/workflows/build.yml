

name: Build BerryEssentials

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: BerryEssentials/pom.xml

      - name: Build plugin
        working-directory: BerryEssentials
        run: mvn --batch-mode -U clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BerryEssentials-JAR
          path: BerryEssentials/target/BerryEssentials.jar
          if-no-files-found: error

